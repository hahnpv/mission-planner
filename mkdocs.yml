site_name: mission-planner
site_description: Generic orbital mission planning — orbit design, propagation, overflight search, a map UI and an MCP server, extensible through plugins.
site_url: https://hahnpv.github.io/mission-planner/
repo_url: https://github.com/hahnpv/mission-planner
repo_name: hahnpv/mission-planner
edit_uri: edit/main/docs/
copyright: Copyright 2026 Hahn Aero · Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - The web UI: guide/web-ui.md
      - Python library: guide/library.md
      - Agents — MCP and REST: guide/agents.md
      - Catalog data: guide/catalog.md
      - Models and assumptions: guide/models.md
  - Plugins:
      - "Tutorial: a ground-station plugin": tutorial.md
      - Plugin guide: plugins.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-planner"
version = "0.1.0"
description = "Generic orbital mission planning: launch-site orbit design, J2/drag-decay propagation, overflight search, web UI + MCP server, plugin API"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hahn Aero" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",  # atmosphere_1976_1000km lookup tables
    "pyyaml>=6.0",  # catalog: sites / presets / overlay sidecars
]

[project.optional-dependencies]
ui = ["flask>=3.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "flask>=3.0", "mcp>=1.0", "ruff>=0.5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]  # the site: mkdocs serve / build (MkDocs 2 drops the theme)

# The core wheel also ships the public example plugin (examples/groundstation),
# so a core install comes with it; plugins arrive through the entry-point group.
[project.entry-points."mission_planner.plugins"]
groundstation = "mp_groundstation:MODULE"

[tool.setuptools.packages.find]
where = [".", "examples/groundstation"]
include = ["mission_planner*", "mp_groundstation*"]

[tool.setuptools.package-data]
# Everything the web UI serves and the catalog reads: recursive, so a new
# static/ui/*.js or data-pack file can't be left out of a wheel.
mission_planner = ["data/**/*", "static/**/*"]
mp_groundstation = ["static/*"]

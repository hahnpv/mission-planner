# Ruff: `ruff check .` / `ruff format .` from the repo root.
target-version = "py312"
line-length = 100
extend-exclude = ["**/__pycache__"]

[lint]
# pyflakes, pycodestyle errors/warnings, import sorting.
select = ["E", "F", "W", "I"]
ignore = [
    "E741",   # ambiguous variable names (l, I, O) — common in math code
    "E501",   # line length is ruff format's job
]

[lint.isort]
known-first-party = ["mission_planner"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]                  # re-exported names

[format]
quote-style = "double"
